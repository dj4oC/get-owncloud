name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify contracts and tests
        run: npm run verify
      - name: Enforce inspectable bootstrap
        run: test "$(wc -l < scripts/install.sh)" -le 500

  catalogue-platform-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify all retained platform tiers are represented
        run: node --test test/platforms.test.mjs
