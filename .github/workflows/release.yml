name: Attested release evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  statuses: read

jobs:
  production-runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run full service lifecycle
        run: sh scripts/runtime-e2e.sh "$GITHUB_WORKSPACE"

  production-browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test the browser generator
        run: |
          SITE_MODE=development npm run build
          npm run test:e2e

  release-evidence:
    runs-on: ubuntu-24.04
    needs: [production-runtime-e2e, production-browser-e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Require green source and full deployment gates on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for context in get-owncloud/ci get-owncloud/full-e2e; do
            state=$(gh api "repos/$REPOSITORY/commits/$SHA/status" \
              --jq ".statuses | map(select(.context == \"$context\")) | first | .state // \"missing\"")
            test "$state" = success || {
              echo "Required commit status $context is $state for $SHA" >&2
              exit 1
            }
          done
      - name: Verify
        run: npm run verify
      - name: Build checksums and source manifest
        run: |
          node scripts/release-manifest.mjs
          node scripts/generate-sbom.mjs
      - name: Attest release evidence
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: "dist/*"
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence
          path: dist/
