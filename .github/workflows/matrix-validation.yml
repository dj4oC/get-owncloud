name: Matrix Validation and Drift Detection

on:
  push:
    branches: [ main, feat/** ]
    paths:
      - 'catalog/**'
      - 'scripts/validate-matrix.mjs'
      - 'scripts/drift-detection.mjs'
  pull_request:
    branches: [ main ]
    paths:
      - 'catalog/**'
      - 'scripts/validate-matrix.mjs'
      - 'scripts/drift-detection.mjs'
  schedule:
    # Run daily drift detection at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-matrix:
    name: Validate MVP Parity Matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate matrix structure and completeness
        run: node scripts/validate-matrix.mjs

  drift-detection:
    name: Upstream Drift Detection
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run drift detection
        id: drift-detection
        run: node scripts/drift-detection.mjs
        continue-on-error: true

      - name: Create GitHub issues for detected drift
        if: always() && steps.drift-detection.outcome == 'success' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This is a placeholder for automated issue creation
          # In a real implementation, this would parse the drift detection output
          # and create GitHub issues for new components/overlays detected
          echo "Issue creation would be implemented based on drift detection output"
          # node scripts/create-drift-issues.mjs

  matrix-and-drift-gate:
    name: Matrix and Drift CI Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [validate-matrix, drift-detection]
    steps:
      - name: Publish aggregate matrix and drift status
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          # Determine overall status
          matrix_passed=$(jq -r '.["validate-matrix"].result' <<< "$NEEDS_JSON")
          drift_passed=$(jq -r '.["drift-detection"].result' <<< "$NEEDS_JSON")
          
          passed=true
          description="Matrix validation and drift detection passed"
          
          if test "$matrix_passed" != "success"; then
            passed=false
            description="Matrix validation failed"
          fi
          
          if test "$drift_passed" != "success"; then
            passed=false
            description="$description, drift detection failed"
          fi
          
          if test "$passed" = true; then
            state=success
          else
            state=failure
          fi
          
          # Only create commit status for pushes, not PRs
          if test "$EVENT_NAME" = push; then
            gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f state="$state" -f context="get-owncloud/matrix-drift" -f description="$description" \
              -f target_url="$RUN_URL" >/dev/null
          fi
          
          # Fail the workflow if any check failed
          test "$passed" = true

  # Additional validation jobs
  check-matrix-completeness:
    name: Check Matrix Completeness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check all capabilities have proper output representation
        run: |
          node -e "
          const fs = require('fs');
          const matrix = JSON.parse(fs.readFileSync('catalog/ocis-full-mvp-matrix.json', 'utf8'));
          const REQUIRED_OUTPUTS = ['docker_compose', 'podman_compose', 'kubernetes_helm', 'kubernetes_argocd'];
          
          let errors = 0;
          for (const [capId, cap] of Object.entries(matrix.matrix)) {
            const outputs = cap.outputs || {};
            for (const output of REQUIRED_OUTPUTS) {
              if (!outputs[output] && !cap.extensions) {
                console.error(\"❌ Capability '\" + capId + \"' missing output '\" + output + \"'\");
                errors++;
              }
            }
            
            // Check nested extensions
            if (cap.extensions) {
              for (const [extId, ext] of Object.entries(cap.extensions)) {
                const extOutputs = ext.outputs || {};
                for (const output of REQUIRED_OUTPUTS) {
                  if (!extOutputs[output]) {
                    console.error(\"❌ Extension '\" + capId + '.' + extId + \"' missing output '\" + output + \"'\");
                    errors++;
                  }
                }
              }
            }
          }
          
          if (errors > 0) {
            console.error(\"Found \" + errors + \" completeness issues\");
            process.exit(1);
          } else {
            console.log(\"✅ All capabilities have proper output representation\");
          }
          " || exit 1

  check-helm-argocd-equivalence:
    name: Check Helm/Argo CD Semantic Equivalence
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Helm and Argo CD semantic equivalence
        run: |
          node -e "
          const fs = require('fs');
          const matrix = JSON.parse(fs.readFileSync('catalog/ocis-full-mvp-matrix.json', 'utf8'));
          
          let errors = 0;
          for (const [capId, cap] of Object.entries(matrix.matrix)) {
            const outputs = cap.outputs || {};
            const helmOutput = outputs.kubernetes_helm;
            const argoOutput = outputs.kubernetes_argocd;
            
            if (helmOutput && argoOutput) {
              if (helmOutput.status !== argoOutput.status) {
                console.error(\"❌ Capability '\" + capId + \"': Helm (\" + helmOutput.status + \") and Argo CD (\" + argoOutput.status + \") status mismatch\");
                errors++;
              }
              
              const helmFeatures = helmOutput.implemented || [];
              const argoFeatures = argoOutput.implemented || [];
              const helmMissing = helmFeatures.filter(f => !argoFeatures.includes(f));
              const argoMissing = argoFeatures.filter(f => !helmFeatures.includes(f));
              
              if (helmMissing.length > 0 || argoMissing.length > 0) {
                console.error(\"❌ Capability '\" + capId + \"': Feature mismatch between Helm and Argo CD\");
                errors++;
              }
            }
            
            // Check nested extensions
            if (cap.extensions) {
              for (const [extId, ext] of Object.entries(cap.extensions)) {
                const extOutputs = ext.outputs || {};
                const helmExtOutput = extOutputs.kubernetes_helm;
                const argoExtOutput = extOutputs.kubernetes_argocd;
                
                if (helmExtOutput && argoExtOutput) {
                  if (helmExtOutput.status !== argoExtOutput.status) {
                    console.error(\"❌ Extension '\" + capId + '.' + extId + \"': Helm and Argo CD status mismatch\");
                    errors++;
                  }
                }
              }
            }
          }
          
          if (errors > 0) {
            console.error(\"Found \" + errors + \" semantic equivalence issues\");
            process.exit(1);
          } else {
            console.log(\"✅ Helm and Argo CD are semantically equivalent\");
          }
          " || exit 1

  # Scheduled drift detection job (runs daily)
  scheduled-drift-detection:
    name: Scheduled Drift Detection
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run comprehensive drift detection
        run: node scripts/drift-detection.mjs

      - name: Create GitHub issues for new discoveries
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # In a real implementation, this would parse the drift detection output
          # and create GitHub issues for any new components/overlays found
          echo "Scheduled drift detection completed"
          # The drift detection script currently outputs findings but doesn't create issues
          # This would be enhanced in a future iteration

  full-matrix-validation-gate:
    name: Full Matrix Validation Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [validate-matrix, check-matrix-completeness, check-helm-argocd-equivalence, drift-detection, scheduled-drift-detection]
    steps:
      - name: Determine overall status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Checking all matrix and drift validation jobs..."
          
          # Extract results from all required jobs
          matrix_result=$(jq -r '.["validate-matrix"].result // "success"' <<< "$NEEDS_JSON")
          completeness_result=$(jq -r '.["check-matrix-completeness"].result // "success"' <<< "$NEEDS_JSON")
          equivalence_result=$(jq -r '.["check-helm-argocd-equivalence"].result // "success"' <<< "$NEEDS_JSON")
          drift_result=$(jq -r '.["drift-detection"].result // "success"' <<< "$NEEDS_JSON")
          scheduled_result=$(jq -r '.["scheduled-drift-detection"].result // "success"' <<< "$NEEDS_JSON")
          
          all_passed=true
          
          for result in "$matrix_result" "$completeness_result" "$equivalence_result" "$drift_result" "$scheduled_result"; do
            if test "$result" != "success"; then
              all_passed=false
              break
            fi
          done
          
          if test "$all_passed" = true; then
            echo "✅ All matrix validation and drift detection checks passed"
            exit 0
          else
            echo "❌ Some matrix validation or drift detection checks failed"
            exit 1
          fi