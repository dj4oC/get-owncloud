apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: owncloud
  namespace: argocd
spec:
  description: Namespace-scoped ownCloud synchronization boundary
  sourceRepos:
    - https://owncloud.github.io/ocis-charts/
  destinations:
    - namespace: owncloud
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
    - group: monitoring.coreos.com
      kind: ServiceMonitor
