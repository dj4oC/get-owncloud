# Generated by get-owncloud. Chart 0.7.0 is intentionally held at oCIS 7.1.4 under issue #6.
image:
  repository: owncloud/ocis
  tag: "7.1.4"
  pullPolicy: IfNotPresent
externalDomain: "cloud.example.net"
logging:
  level: info
  pretty: false
  color: false
insecure:
  oidcIdpInsecure: false
  ocisHttpApiInsecure: false
  ocmInsecure: false
ingress:
  enabled: true
  ingressClassName: "nginx"
  tls:
    - secretName: "owncloud-tls"
      hosts:
        - "cloud.example.net"
features:
  demoUsers: false
  virusscan:
    enabled: false
  emailNotifications:
    enabled: false
  externalUserManagement:
    enabled: true
    oidc:
      issuerURI: "https://id.example.net/realms/owncloud"
      userIDClaim: "preferred_username"
      userIDClaimAttributeMapping: username
    ldap:
      writeable: false
      uri: "ldaps://directory.example.net:636"
      certTrusted: true
      insecure: false
      bindDN: "uid=ocis,ou=system,dc=example,dc=net"
      user:
        baseDN: "ou=users,dc=example,dc=net"
        schema:
          id: "ownclouduuid"
          userName: "uid"
      group:
        baseDN: "ou=groups,dc=example,dc=net"
        schema:
          id: "ownclouduuid"
          groupName: "cn"
  appsIntegration:
    enabled: true
    wopiIntegration:
      officeSuites:
        - name: "Collabora Online"
          product: "Collabora"
          enabled: true
          uri: "https://office.example.net"
          iconURI: "https://office.example.net/favicon.ico"
          description: "Open office documents with Collabora"
          insecure: false
          disableProof: false
          secureViewEnabled: true
          disableChat: false
          ingress:
            enabled: false
secretRefs:
  ldapSecretRef: "owncloud-external-ldap"
services:
  storageusers:
    storageBackend:
      driver: "ocis"
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "852Gi"
      storageClassName: "nfs-4-2"
  nats:
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-4-2"
  search:
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-4-2"
  storagesystem:
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-4-2"
  thumbnails:
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-4-2"
  web:
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-4-2"
  ocm:
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-4-2"
