---
services:
  keycloak-db:
    image: docker.io/library/postgres@sha256:9f960731546a19d453f817542225535087991428229813043480184099ce028
    networks:
      ocis-net: {}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always

  keycloak:
    image: docker.io/keycloak/keycloak@sha256:0e3483351197ae1558340473bc54b8f8151842871464090200e58f208c070c30
    networks:
      ocis-net: {}
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      DB_VENDOR: postgres
      DB_ADDR: keycloak-db
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY: edge
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HTTPS_KEY_STORE_FILE: /etc/x509/https/tls.crt
      KC_HTTPS_KEY_STORE_PASSWORD: changeit
      KC_HTTPS_TRUST_STORE_FILE: /etc/x509/https/tls.crt
    volumes:
      - ./certs:/etc/x509/https:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/auth/realms/master/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  keycloak-db-data:
